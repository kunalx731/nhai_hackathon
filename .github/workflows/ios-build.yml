name: iOS Build (Unsigned)

on:
  push:
    branches: [main, master, final_v1]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    env:
      # ccache tuned so hits survive prebuild regenerating files each run
      # (content hashing + ignore timestamps).
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_SLOPPINESS: clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
      CCACHE_FILECLONE: 'true'
      CCACHE_DEPEND: 'true'
      CCACHE_INODECACHE: 'true'
      CCACHE_MAXSIZE: '2G'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install ccache
        run: which ccache || brew install ccache

      - name: Cache ccache (compiled objects)
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ hashFiles('package-lock.json') }}-
            ccache-

      - name: Cache CocoaPods (spec repo + downloaded pods)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: cocoapods-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            cocoapods-

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply patches
        run: npx patch-package

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --clean

      - name: Install Pods
        run: |
          cd ios
          # $EnableCoreMLDelegate, the fmt consteval fix, and ccache are applied
          # by the withIosTfliteCoreML config plugin during prebuild (above), so
          # no manual Podfile edits are needed here.
          pod install

      - name: Build unsigned .app
        run: |
          ccache -z || true
          cd ios
          xcodebuild \
            -workspace UPAS.xcworkspace \
            -scheme UPAS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/UPAS.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          ccache -s || true

      - name: Create unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/UPAS.xcarchive/Products/Applications/UPAS.app build/Payload/
          cd build
          zip -r UPAS-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: UPAS-unsigned-ipa
          path: build/UPAS-unsigned.ipa
